<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> SIGN UP </title>
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Imprima&family=Inclusive+Sans:ital@0;1&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- Frame HP -->
    <div class = "signup-container">

        <!-- Bar notif, battery, wifi, etc. -->
        <div class="top-bar">
            <img src="assets/Time.svg">
            <img src="assets/right icons.svg">
        </div>

        <!-- Logo E-Inteiler -->

        <div class="logo-section2">
            <img class="logo" src="assets/craiyon_125428_image.png" alt="logo"/>
        </div>

        <!-- Kotak input untuk pengguna mengisi data -->
        <form action="#" method="post"aria-label="Create account form">
            <div class="input-box">
                    <input type="text" name="masuk-id" id="masuk-id" placeholder="Masukkan Username / Email / Nomer"/>
                </div>

                <div class="input-box">
                    <input type="password" name="masuk-password" id="masuk-password" placeholder="Masukkan Password">
                </div>
            
            
            <div class="alt-option">
                <p>atau</p>
                <button class="continue-google" type="button">
                        <img src="assets/Google Logo.png" alt="">
                        Continue with Google
                </button>

                <button class="buat-akun" type="submit">
                        <img src="" alt="">
                        Buat Akun!
                </button>
            </div>
        </form>
        <p class="belum-punya-akun">
            <span class="span">Belum punya akun? </span>
            <a href="sign-in.html">Sign In</a>
        </p>
    </div>
</body>
</html>
