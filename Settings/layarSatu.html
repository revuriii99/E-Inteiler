
  <!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HALAMAN 1: SETTINGS -->
  <div id="page-settings">

    <!-- Bagian profil -->
    <div id="profile-section">
      <h2>Profil</h2>
      <img src="../Dashboard/ASSET/profil.svg" alt="Avatar">
      <p id="nama">Selin</p>
      <p id="username">@nararachelradenissavincent</p>
      <button id="btn-edit">Edit</button>
    </div>

    <!-- List pengaturan -->
    <p>Pengaturan</p>
    <ul id="settings-list">
      <li>
        <img src="../Dashboard/ASSET/notifications.svg" alt=""> Notifikasi Harian
        <div class="toggle"></div>
      </li>
      <li>
        <img src="../Dashboard/ASSET/logout.svg" alt=""> Keluar Akun
        <img src="../Dashboard/ASSET/arrow.svg" alt="chevron">
      </li>
      <li>
        <img src="../Dashboard/ASSET/darkmode.svg" alt=""> Dark Mode
        <div class="toggle"></div>
      </li>
      <li>
        <img src="../Dashboard/ASSET/font.svg" alt=""> Font
        <img src="../Dashboard/ASSET/arrow.svg" alt="chevron">
      </li>
      <li>
        <img src="../Dashboard/ASSET/texttospeecb.svg" alt=""> Text to speech
        <div class="toggle"></div>
      </li>
    </ul>

    <!-- Bottom nav -->
    <nav id="bottom-nav">
      <div><img src="../Dashboard/ASSET/HOME.svg" alt=""> <span>Home</span></div>
      <div><img src="../../Dashboard/ASSET/TASK LOGO.svg" alt=""> <span>Tasks</span></div>
      <div><img src="../Dashboard/ASSET/POMODORO LOGO.svg" alt=""> <span>Pomodoro</span></div>
      <div class="active"><img src="../Dashboard/ASSET/SETTINGS LOGO.svg" alt=""> <span>Settings</span></div>
    </nav>

  </div>

</body>
</html>
