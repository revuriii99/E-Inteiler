<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Edit Akun</title>
        <link rel="stylesheet" href="style.css?v=3">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Inclusive+Sans&display=swap" rel="stylesheet">
    </head>
    <body>
        <div>
             <div id="page-edit">

    <div id="status-bar">
      <img src="../Dashboard/ASSET/Time.svg" alt="9:30">
      <img src="../Dashboard/ASSET/ICON.svg" alt="status">
    </div>

    <div id="edit-header">
      <img src="../Dashboard/ASSET/Back.svg" alt="back button">
      <h2>Edit Akun</h2>
    </div>

    <div id="change-photo">
      <img src="../Dashboard/ASSET/profil.svg" alt="Avatar">
      <p>Change Profile Picture</p>
    </div>

    <div class="field-group">
      <img src="../Dashboard/ASSET/Envelope.svg" alt="">
      <input type="email" value="s*********k@gmail.com">
      <a href="#">Ganti Email</a>
    </div>

    <div class="field-group">
      <img src="../Dashboard/ASSET/username.svg" alt="">
      <input type="text" value="Selin">
      <a href="#">Ganti Nama</a>
    </div>

    <div class="field-group">
      <img src="../Dashboard/ASSET/gembok.svg" alt="">
      <input type="password" value="password123">
      <a href="#">Ganti Password</a>
    </div>

    <button id="btn-simpan">Simpan Perubahan</button>

    <nav id="bottom-nav">
      <div><img src="../Dashboard/ASSET/HOME.svg" alt=""><span>Home</span></div>
      <div><img src="../Dashboard/ASSET/TASK LOGO.svg" alt=""><span>Tasks</span></div>
      <div><img src="../Dashboard/ASSET/POMODORO LOGO.svg" alt=""><span>Pomodoro</span></div>
      <div class="active"><img src="../Dashboard/ASSET/SETTINGS LOGO.svg" alt=""><span>Settings</span></div>
    </nav>
        </div>

</html>
